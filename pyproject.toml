[project]
name = "marty"
dynamic = ["version"]
description = "MARTY - self-hosted personal AI assistant controlled through Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "httpx>=0.28,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a running PostgreSQL (set RUN_INTEGRATION_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# SQLAlchemy declarative configuration is expressed as class attributes.
"app/database/**" = ["RUF012"]
